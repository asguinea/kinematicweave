name: Bug report
description: Report a reproducible defect in KinematicWeave.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Do not include credentials, private datasets, or identifying records.
        Use private vulnerability reporting for security issues.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest command, fixture, or code example that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0a0 or commit identifier
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and Python version
      placeholder: Ubuntu 24.04, Python 3.12.13
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      render: shell
